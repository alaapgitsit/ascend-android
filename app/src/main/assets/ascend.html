<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2096%2096%22%3E%3Crect%20width%3D%2296%22%20height%3D%2296%22%20rx%3D%2222%22%20fill%3D%22%23ff3a22%22%2F%3E%3Cpath%20d%3D%22M18%2072%20L44%2034%20L56%2054%20L64%2042%20L80%2072%20Z%22%20fill%3D%22%23f3efe6%22%2F%3E%3Ccircle%20cx%3D%2266%22%20cy%3D%2230%22%20r%3D%226%22%20fill%3D%22%23c7af6b%22%2F%3E%3C%2Fsvg%3E">
<style>html,body{background:#f3efe6}</style>
<title>Ascend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* ---- Ascend — "five/four" editorial identity ----
   Layout: full-height app shell — sticky top bar, scrolling main, bottom tab bar.
   Color: warm paper base, vermillion red energy, gold + muted teal accents. Clean Archivo display / Manrope body. Committed light theme. */
:root{
  color-scheme: light;
  --bg:#f3efe6;
  --surface:#ffffff;
  --surface-2:#ece6d7;
  --surface-3:#e1dac6;
  --line:#dcd4c0;
  --fg:#191714;
  --muted:#6c6454;
  --faint:#9b937f;
  --primary:#ff3a22;
  --primary-2:#ff6a55;
  --magenta:#ff3a22;
  --cyan:#628078;
  --lime:#a4893d;
  --gold:#c7af6b;
  --danger:#cc2a16;
  --grad:linear-gradient(135deg,#ff3a22 0%,#ff6a55 100%);
  --grad-cyan:linear-gradient(135deg,#628078 0%,#4d6b61 100%);
  --font-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-ui:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  --shadow:0 10px 28px rgba(60,40,10,.14);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
img{max-width:100%}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--fg)}
input::placeholder,textarea::placeholder{color:var(--faint)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:9px}
.tnum{font-variant-numeric:tabular-nums}
.range-row{display:flex;gap:6px;margin:10px 0 2px}
.range-pill{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 4px;font-weight:800;font-size:12px;color:var(--muted)}
.range-pill.active{background:var(--primary);border-color:var(--primary);color:#fff}
.range-pill:active{transform:scale(.97)}
.range-tag{font-family:var(--font-ui);font-size:10.5px;font-weight:700;color:var(--faint);text-transform:none;letter-spacing:0;margin-left:6px}
.goal-row input[type=date]{color-scheme:light}
[class*="-ring"] *,.ring span,.cal-left,.fast-time,.stat .v,.snap .v,.v.tnum{font-variant-numeric:tabular-nums;letter-spacing:-.3px}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;position:relative}
#topbar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:14px 18px 12px;
  background:linear-gradient(180deg,rgba(243,239,230,.96),rgba(243,239,230,.72));backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.logo{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(255,58,34,.4)}
.logo svg{width:20px;height:20px;display:block}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.5px;margin:0;line-height:1}
.brand .sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-top:1px}
.streak-chip{display:flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line);
  padding:6px 11px;border-radius:999px;font-weight:800;font-size:14px}
.streak-chip .flame{font-size:15px;filter:saturate(1.3)}
.icon-btn{width:38px;height:38px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;font-size:17px}
.icon-btn:active{transform:scale(.94)}

main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:18px 16px calc(96px + env(safe-area-inset-bottom,0px))}
.tab-panel{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- bottom nav ---------- */
#nav{flex:0 0 auto;position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(0deg,var(--bg) 60%,rgba(243,239,230,0));z-index:20}
.nav-inner{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:20px;
  padding:6px;box-shadow:var(--shadow);width:100%;max-width:420px}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  padding:7px 4px;min-height:58px;border:0;
  background:transparent;border-radius:16px;color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:.4px;
  text-transform:uppercase;transition:color .18s,background .18s}
.nav-btn svg{width:22px;height:22px}
.nav-btn.active{color:var(--fg);background:var(--surface-2)}
.nav-btn.center .fab{width:38px;height:38px;border-radius:50%;background:var(--grad);display:grid;place-items:center;
  box-shadow:0 4px 14px rgba(255,58,34,.45)}
.nav-btn.center .fab svg{width:22px;height:22px;color:#fff}
.nav-btn.center.active{background:transparent;color:var(--primary)}
.nav-btn.center.active .fab{box-shadow:0 6px 18px rgba(255,58,34,.55)}

/* ---------- generic ---------- */
.section-title{font-family:var(--font-display);font-weight:400;font-size:13px;letter-spacing:2px;
  text-transform:uppercase;color:var(--muted);margin:22px 2px 12px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:12px}
.btn{border:0;border-radius:13px;padding:13px 18px;font-weight:800;font-size:15px;letter-spacing:.3px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--fg);transition:transform .12s,filter .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 18px rgba(255,58,34,.35)}
.btn-ghost{background:transparent}
.btn-block{width:100%}
.btn-cyan{background:var(--grad-cyan);border:0;color:#04121a}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.lime{color:var(--lime);border-color:rgba(164,137,61,.35);background:rgba(164,137,61,.08)}
.pill.mag{color:var(--magenta);border-color:rgba(255,58,34,.35);background:rgba(255,58,34,.08)}
.pill.cyan{color:var(--cyan);border-color:rgba(98,128,120,.35);background:rgba(98,128,120,.08)}

/* ---------- home / dashboard ---------- */
.hero{background:var(--grad);border-radius:20px;padding:18px 18px 16px;position:relative;overflow:hidden;
  box-shadow:0 12px 34px rgba(255,58,34,.3)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.25),transparent 70%)}
.hero .eyebrow{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:rgba(255,255,255,.85);font-weight:800}
.hero .quote{font-family:var(--font-display);font-weight:400;font-size:26px;line-height:1.05;color:#fff;margin:6px 0 0;
  text-wrap:balance;max-width:92%}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .k{font-size:10px;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v small{font-size:14px;color:var(--muted);font-family:var(--font-ui);font-weight:700;margin-left:3px}
.stat .v .flame{font-family:var(--font-ui)}
.stat.accent .v{color:var(--primary)}
.stat.cyan .v{color:var(--cyan)}
.stat.lime .v{color:var(--lime)}
.ring-wrap{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:58px;height:58px;flex:0 0 auto;border-radius:50%;
  background:conic-gradient(var(--primary) calc(var(--p)*1%),var(--surface-3) 0);display:grid;place-items:center}
.ring::before{content:"";position:absolute;width:44px;height:44px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;font-family:var(--font-display);font-weight:800;font-size:17px;line-height:1}
.ringbox{position:relative;width:58px;height:58px;display:grid;place-items:center}

.week-dots{display:flex;justify-content:space-between;gap:6px;margin-top:4px}
.wd{flex:1;text-align:center}
.wd .dot{width:100%;aspect-ratio:1;max-width:34px;margin:0 auto 5px;border-radius:11px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--faint)}
.wd .dot.on{background:var(--grad);border:0;color:#fff;box-shadow:0 4px 12px rgba(255,58,34,.35)}
.wd .dot.today{outline:2px solid var(--cyan);outline-offset:1px}
.wd .lbl{font-size:9.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);font-weight:800}
.wd .dnum{font-size:9px;font-weight:800;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.wd .dnum.today{color:var(--cyan)}
.week-dots{gap:4px}

.hist-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;margin-bottom:10px}
.hist-head{display:flex;align-items:flex-start;gap:10px}
.hist-head .date{font-family:var(--font-display);font-size:19px;line-height:1}
.hist-head .date small{display:block;font-family:var(--font-ui);font-size:10px;letter-spacing:1.5px;
  text-transform:uppercase;color:var(--faint);font-weight:800;margin-top:3px}
.hist-head .meta{margin-left:auto;text-align:right}
.hist-head .meta .vol{font-family:var(--font-display);font-size:20px;color:var(--primary);line-height:1}
.hist-head .meta .volk{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:800}
.hist-ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.ex-chip{font-size:11.5px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);
  border-radius:8px;padding:3px 8px;color:var(--muted)}
.ex-chip b{color:var(--fg)}
.hist-foot{display:flex;align-items:center;gap:12px;margin-top:11px;padding-top:11px;border-top:1px solid var(--line);
  font-size:12px;color:var(--muted)}
.hist-foot .gar{margin-left:auto;background:var(--surface-2);border:1px solid var(--line);color:var(--cyan);
  font-size:12px;font-weight:800;padding:5px 10px;border-radius:8px}
.hist-foot .gar:active{filter:brightness(1.25)}
.hist-foot .del{background:transparent;border:0;color:var(--faint);font-size:12px;font-weight:700;padding:5px 6px}
.hist-foot .del:active{color:var(--danger)}

.empty{text-align:center;padding:42px 20px;color:var(--muted)}
.empty .big{font-family:var(--font-display);font-size:48px;line-height:1;margin-bottom:8px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.empty p{max-width:30ch;margin:6px auto 0;color:var(--faint)}

/* ---------- log ---------- */
.tpl-select{position:relative}
.tpl-select select{width:100%;appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px 44px 16px 16px;font-weight:800;font-size:16px}
.tpl-select::after{content:"▾";position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--primary);
  font-size:16px;pointer-events:none}
.sess-bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:14px 0 4px;padding:12px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line)}
.start-btn{display:flex;align-items:center;gap:6px;background:var(--grad);border:0;color:#fff;border-radius:11px;
  padding:9px 15px;font-weight:800;font-size:13px;box-shadow:0 4px 12px rgba(255,58,34,.35)}
.start-btn.running{background:var(--surface-2);border:1px solid var(--line);color:var(--fg);box-shadow:none}
.start-btn:active{transform:scale(.96)}
.sess-bar .timer{font-family:var(--font-display);font-size:22px;letter-spacing:.5px}
.sess-bar .timer.run{color:var(--lime)}
.sess-bar .lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);font-weight:800}
.rest-btn{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:11px;padding:9px 13px;font-weight:800;font-size:13px}
.rest-btn.active{background:var(--grad-cyan);border:0;color:#04121a}
.when-row{display:flex;flex-direction:column;gap:7px;margin:14px 0 2px;padding:12px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line)}
.when-row input{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;
  font-weight:700;color:var(--fg);color-scheme:light;width:100%}
.when-row input:focus{outline:0;border-color:var(--primary)}
.when-row .lbl{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);font-weight:800}
.savedline{font-size:10.5px;color:var(--faint);font-weight:700;text-align:right;margin:4px 4px 0;letter-spacing:.3px}

.ex-block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.ex-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ex-num{width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:var(--surface-3);display:grid;place-items:center;
  font-family:var(--font-display);font-size:14px;color:var(--primary)}
.ex-name{flex:1;min-width:0;background:transparent;border:0;border-bottom:1.5px solid transparent;padding:4px 2px;
  font-weight:800;font-size:16px}
.ex-name:focus{outline:0;border-bottom-color:var(--primary)}
.ex-name.open{border-bottom:1.5px dashed var(--line)}
.ex-best{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--faint);white-space:nowrap}
.ex-best b{color:var(--cyan)}
.ex-del{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);
  color:var(--faint);font-size:17px;line-height:1;font-weight:700;display:grid;place-items:center}
.ex-del:active{color:var(--danger);border-color:var(--danger)}
.sets-head,.set-row{display:grid;grid-template-columns:34px 1fr 1fr 30px;gap:8px;align-items:center}
.sets-head{margin-bottom:6px}
.sets-head span{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:800;text-align:center}
.sets-head span:first-child{text-align:left;padding-left:4px}
.set-row{margin-bottom:7px}
.set-n{font-family:var(--font-display);font-size:15px;color:var(--faint);text-align:center}
.set-row input{width:100%;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:11px 6px;font-weight:700;font-size:16px;-moz-appearance:textfield}
.set-row input::-webkit-outer-spin-button,.set-row input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.set-row input:focus{outline:0;border-color:var(--primary);background:var(--surface-3)}
.set-row input.filled{border-color:rgba(98,128,120,.4)}
.set-row .track{font-size:10px;color:var(--cyan);text-align:center;font-weight:900}
.set-row .track.off{color:transparent}
.type-toggle{display:flex;gap:6px;margin-bottom:11px}
.type-toggle button{flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
  border-radius:10px;padding:8px;font-weight:800;font-size:12.5px}
.type-toggle button.on{background:var(--surface-3);color:var(--fg);border-color:var(--primary)}
.type-toggle button:active{transform:scale(.97)}
.cardio-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cfield{display:flex;flex-direction:column;gap:5px}
.cfield span{font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--faint);font-weight:800}
.cfield input{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;
  font-weight:700;font-size:16px;text-align:center;-moz-appearance:textfield}
.cfield input::-webkit-outer-spin-button,.cfield input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cfield input:focus{outline:0;border-color:var(--cyan)}
.pace{margin-top:9px;text-align:center;font-size:12px;font-weight:800;color:var(--cyan);min-height:14px}
.ex-block textarea.note{width:100%;margin-top:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
  padding:9px 11px;font-size:14px;resize:vertical;min-height:0;height:38px}
.add-ex{width:100%;background:transparent;border:1.5px dashed var(--line);border-radius:14px;padding:13px;
  color:var(--muted);font-weight:800;font-size:14px;margin-bottom:12px}
.add-ex:active{border-color:var(--primary);color:var(--primary)}
.save-row{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.export-note{font-size:11.5px;color:var(--faint);text-align:center;line-height:1.5;margin-top:2px}
.export-note b{color:var(--muted)}

/* ---------- graphs ---------- */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 10px}
.chart-wrap{position:relative;height:230px;margin-top:6px}
.ex-pills{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch}
.ex-pills::-webkit-scrollbar{display:none}
.ex-pill{flex:0 0 auto;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:9px 15px;
  font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.ex-pill.active{background:var(--grad-cyan);border:0;color:#04121a}
.prog-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.prog-item{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px}
.prog-item .nm{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog-item .bw{font-family:var(--font-display);font-size:26px;line-height:1.1;margin-top:5px}
.prog-item .bw small{font-size:12px;color:var(--muted);font-family:var(--font-ui);font-weight:700}
.prog-item .chg{font-size:11px;font-weight:800;margin-top:2px}
.chg.up{color:var(--lime)}.chg.down{color:var(--danger)}.chg.flat{color:var(--faint)}

/* ---------- modal / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(6,6,10,.72);backdrop-filter:blur(3px);z-index:60;display:grid;
  place-items:end center;padding:0}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;
  width:100%;max-width:560px;max-height:86vh;overflow-y:auto;padding:20px 18px calc(26px + env(safe-area-inset-bottom,0px));
  animation:slideup .3s cubic-bezier(.2,.8,.2,1)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
.sheet h2{font-family:var(--font-display);font-weight:400;font-size:22px;letter-spacing:.5px;margin:2px 0 4px}

/* ---------- date helpers ---------- */
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
function mondayOf(d){const x=startOfDay(d);const g=(x.getDay()+6)%7;x.setDate(x.getDate()-g);return x;}
function sameDay(a,b){return startOfDay(a).getTime()===startOfDay(b).getTime();}
function fmtDate(iso){const d=new Date(iso);return d.toLocaleDateString(undefined,{day:"numeric",month:"short"});}
function fmtDow(iso){return new Date(iso).toLocaleDateString(undefined,{weekday:"short"});}
function fmtTime(iso){return new Date(iso).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}
function localDatetimeValue(d){ // -> "YYYY-MM-DDTHH:MM" in local time for <input type=datetime-local>
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function daysAgo(iso){const d=Math.round((startOfDay(Date.now())-startOfDay(iso))/864e5);
  return d===0?"Today":d===1?"Yesterday":d+" days ago";}

/* ---------- derived stats ---------- */
function workoutVolumeKg(w){let v=0;w.exercises.forEach(ex=>(ex.sets||[]).forEach(s=>{
  if(s.reps!=null&&s.weightKg!=null)v+=s.reps*s.weightKg;}));return v;}
function trackedKg(ex){ // last of set3/set4 with a weight
  if(ex.type==="cardio"||!ex.sets)return null;
  const s4=ex.sets[3], s3=ex.sets[2];
  if(s4&&s4.weightKg!=null)return s4.weightKg;
  if(s3&&s3.weightKg!=null)return s3.weightKg;
  // fallback: heaviest filled set
  let m=null;ex.sets.forEach(s=>{if(s.weightKg!=null)m=(m==null?s.weightKg:Math.max(m,s.weightKg));});
  return m;
}
function allExerciseNames(){const set=new Set();

function seriesFor(name){ // [{date, kg}] sorted asc
  const out=[];
  state.workouts.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).forEach(w=>{
    w.exercises.forEach(ex=>{if(ex.name===name){const k=trackedKg(ex);if(k!=null)out.push({date:w.date,kg:k});}});
  });
  return out;
}
function bestKg(name){let m=null;seriesFor(name).forEach(p=>{m=(m==null?p.kg:Math.max(m,p.kg));});return m;}
function weeklyStreak(){ // consecutive weeks (incl current) with >=1 workout
  if(!state.workouts.length)return 0;
  const weeks=new Set(state.workouts.map(w=>mondayOf(w.date).getTime()));
  let cur=mondayOf(Date.now()).getTime(), streak=0;
  // allow current week to be empty without breaking (grace)
  if(!weeks.has(cur)){cur-=7*864e5; if(!weeks.has(cur))return 0;}
  while(weeks.has(cur)){streak++;cur-=7*864e5;}
  return streak;
}
function thisWeekCount(){const m=mondayOf(Date.now()).getTime();
  return state.workouts.filter(w=>mondayOf(w.date).getTime()===m).length;}
function totalVolumeKg(){return state.workouts.reduce((a,w)=>a+workoutVolumeKg(w),0);}

/* ---------- LOG ---------- */
function newSession(tplId){
  const t=TEMPLATES[tplId];
  const exercises=t.exercises.map(e=>{
    const obj = (typeof e==="object") ? e : {name:e, open:false};
    const name = obj.name||"";
    const open = obj.open!==undefined ? !!obj.open : (name==="");
    const label = obj.label||"";
    const type = obj.type||"strength";
    return {name, label, open, type, cardio:{distance:"",duration:""},
      sets:Array.from({length:SETS_PER_EX},()=>({reps:DEFAULT_REPS,weight:""}))};
  });
  return {templateId:tplId, startedAt:Date.now(), when:localDatetimeValue(new Date()),
    timer:{running:false, elapsedBefore:0, startedAt:null}, exercises, note:""};
}

     </div>
     <div class="sess-bar">
       <div><div class="lbl">Workout timer</div><div class="timer" id="sessTimer">0:00</div></div>

     </div>

    wireLogInputs(el);

function paceStr(c){
  const d=parseFloat(c&&c.distance), t=parseFloat(c&&c.duration);
  if(isFinite(d)&&d>0&&isFinite(t)&&t>0){const p=t/d;const m=Math.floor(p);const s=Math.round((p-m)*60);
    return `Pace ${m}:${String(s).padStart(2,"0")} /km`;}
  return "";
}
function renderExBlock(ex,i){
  const type=ex.type||"strength";
  const best=(type==="strength"&&ex.name)?bestKg(ex.name):null;
  const bestD=best!=null?`<span class="ex-best">PB <b>${Math.round(fromKg(best))}${unitLbl()}</b></span>`:"";
  const toggle= ex.open ? `<div class="type-toggle" data-ex="${i}">
      <button class="${type==='strength'?'on':''}" data-type="strength">💪 Strength</button>
      <button class="${type==='cardio'?'on':''}" data-type="cardio">🏃 Cardio</button>
    </div>` : "";
  let bodyHtml;
  if(type==="cardio"){
    const c=ex.cardio||{distance:"",duration:""};
    bodyHtml=`<div class="cardio-grid">
      <label class="cfield"><span>Distance (km)</span>
        <input type="number" inputmode="decimal" placeholder="–" data-ex="${i}" data-f="distance" value="${esc(c.distance)}"></label>
      <label class="cfield"><span>Time (min)</span>
        <input type="number" inputmode="decimal" placeholder="–" data-ex="${i}" data-f="duration" value="${esc(c.duration)}"></label>
    </div>
    <div class="pace" id="pace-${i}">${paceStr(c)}</div>`;
  }else{
    let rows="";
    for(let s=0;s<ex.sets.length;s++){
      const st=ex.sets[s];
      const isTrack=(s===3&&st.weight!=="")||(s===2&&ex.sets[3].weight===""&&st.weight!=="");
      rows+=`<div class="set-row">
        <div class="set-n">${s+1}</div>
        <input type="number" inputmode="numeric" placeholder="reps" class="${st.reps!==''?'filled':''}" data-ex="${i}" data-set="${s}" data-f="reps" value="${esc(st.reps)}">
        <input type="number" inputmode="decimal" placeholder="–" class="${st.weight!==''?'filled':''}" data-ex="${i}" data-set="${s}" data-f="weight" value="${esc(st.weight)}">
        <div class="track ${isTrack?'':'off'}">●</div>
      </div>`;
    }
    bodyHtml=`<div class="sets-head"><span>Set</span><span>Reps</span><span>Weight (${unitLbl()})</span><span></span></div>${rows}`;
  }
  return `<div class="ex-block">
    <div class="ex-top">
      <div class="ex-num">${i+1}</div>
      <input class="ex-name ${ex.open?'open':''}" data-ex="${i}" data-f="name" placeholder="${esc(ex.label||(type==='cardio'?'Run, row, bike…':'Exercise name'))}" value="${esc(ex.name)}">
      ${bestD}
      <button class="ex-del" data-del-ex="${i}" title="Remove exercise" aria-label="Remove exercise">×</button>
    </div>
    ${toggle}
    ${bodyHtml}
  </div>`;
}
function wireLogInputs(el){
  $$('input[data-ex]',el).forEach(inp=>{
    inp.addEventListener("input",()=>{
      const i=+inp.dataset.ex, f=inp.dataset.f, ex=session.exercises[i];
      if(f==="name"){ex.name=inp.value;}
      else if(f==="distance"||f==="duration"){ex.cardio=ex.cardio||{distance:"",duration:""};ex.cardio[f]=inp.value;
        const pc=document.getElementById("pace-"+i);if(pc)pc.textContent=paceStr(ex.cardio);}
      else{const s=+inp.dataset.set;ex.sets[s][f]=inp.value;
        inp.classList.toggle("filled",inp.value!=="");
        updateTrackDots(el,i);}
      saveDraft();
    });
  });
  $$('.type-toggle button',el).forEach(b=>b.addEventListener("click",()=>{
    const i=+b.parentElement.dataset.ex;
    session.exercises[i].type=b.dataset.type;saveDraft();renderLog();
  }));
  $$('.ex-del',el).forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.delEx;session.exercises.splice(i,1);saveDraft();renderLog();
  }));
}
function updateTrackDots(el,i){
  const block=$$('.ex-block',el)[i];if(!block)return;
  const ex=session.exercises[i];
  $$('.set-row .track',block).forEach((d,s)=>{
    const st=ex.sets[s];
    const isTrack=(s===3&&st.weight!=="")||(s===2&&ex.sets[3].weight===""&&st.weight!=="");
    d.classList.toggle("off",!isTrack);
  });
}
function sessionHasData(){return session&&session.exercises.some(ex=>ex.sets.some(s=>s.reps!==""||s.weight!==""));}

/* session timer — manual start/pause */
let sessInt=null;
function timerElapsed(){
  if(!session||!session.timer)return 0;
  const t=session.timer;let e=t.elapsedBefore||0;
  if(t.running&&t.startedAt)e+=(Date.now()-t.startedAt)/1000;
  return Math.floor(e);
}
function startSessTimer(){stopSessTimer();if(!session)return;
  const tick=()=>{const t=$("#sessTimer");if(!t){stopSessTimer();return;}
    const s=timerElapsed();
    t.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
    t.classList.toggle("run", !!(session.timer&&session.timer.running));};
  tick();sessInt=setInterval(tick,1000);}
function stopSessTimer(){if(sessInt){clearInterval(sessInt);sessInt=null;}}
function startTimer(){if(!session)return;const t=session.timer;if(t.running)return;
  t.running=true;t.startedAt=Date.now();saveDraft();updateTimerBtn();}
function pauseTimer(){if(!session)return;const t=session.timer;if(!t.running)return;
  t.elapsedBefore=(t.elapsedBefore||0)+(Date.now()-t.startedAt)/1000;t.running=false;t.startedAt=null;saveDraft();updateTimerBtn();}
function toggleTimer(){if(!session)return;session.timer.running?pauseTimer():startTimer();}
function updateTimerBtn(){const b=$("#startTimerBtn");if(!b)return;
  const r=session&&session.timer&&session.timer.running;
  b.textContent=r?"⏸ Pause":(timerElapsed()>0?"▶ Resume":"▶ Start");
  b.classList.toggle("running",!!r);}

/* rest timer */
let restInt=null, restLeft=0;
function toggleRest(){
  const btn=$("#restBtn");if(!btn)return;
  if(restInt){clearInterval(restInt);restInt=null;btn.classList.remove("active");$("#restLbl").textContent="90s";return;}
  restLeft=90;btn.classList.add("active");$("#restLbl").textContent=restLeft+"s";
  restInt=setInterval(()=>{restLeft--;const l=$("#restLbl");
    if(l)l.textContent=restLeft+"s";
    if(restLeft<=0){clearInterval(restInt);restInt=null;
      try{navigator.vibrate&&navigator.vibrate([200,80,200]);}catch(e){}
      const b=$("#restBtn");if(b){b.classList.remove("active");$("#restLbl").textContent="Done!";setTimeout(()=>{const x=$("#restLbl");if(x)x.textContent="90s";},1500);}
      toast("⏱ Rest over — go!");}
  },1000);
}

/* ---------- finish / save ---------- */
function finishWorkout(sendGarmin){
  if(!session){return;}
  // build clean workout
  const exercises=[];
  session.exercises.forEach(ex=>{
    const name=(ex.name||"").trim();
    if(!name)return;
    if((ex.type||"strength")==="cardio"){
      const dist=num((ex.cardio||{}).distance), dur=num((ex.cardio||{}).duration);
      if(dist!=null||dur!=null) exercises.push({name,type:"cardio",cardio:{distanceKm:dist,durationMin:dur}});
    }else{
      const sets=ex.sets.map(s=>{
        const r=s.reps!==""?num(s.reps):null;
        const w=s.weight!==""?toKg(num(s.weight)):null;
        return {reps:r, weightKg:w, _perf:(w!=null)||(r!=null&&s.reps!==DEFAULT_REPS)};
      });
      if(sets.some(s=>s._perf)) exercises.push({name,type:"strength",sets:sets.map(s=>({reps:s.reps,weightKg:s.weightKg}))});
    }
  });
  if(!exercises.length){toast("Add a weight, or a cardio distance/time first");return;}
  let when=session.when?new Date(session.when):new Date();
  if(isNaN(when.getTime()))when=new Date();
  const liveSec=timerElapsed();
  const isPast=Math.abs(Date.now()-when.getTime())>36e5; // >1h from now = a past log
  const durationSec=isPast?0:liveSec;
  // PR detection against existing history
  const prs=[];
  exercises.forEach(ex=>{const prev=bestKg(ex.name);const now=trackedKg(ex);
    if(now!=null && (prev==null||now>prev)) prs.push({name:ex.name, kg:now});});
  const workout={id:"w"+Date.now()+Math.random().toString(36).slice(2,6),
    date:when.toISOString(), templateId:session.templateId, durationSec, note:session.note||"",
    exercises, prs:prs.map(p=>p.name)};
  state.workouts.push(workout);save();

  const hadPR=prs.length>0;
  session=null;stopSessTimer();stopAutoSave();clearDraft();
  setTab("home");
  if(hadPR){prCelebrate(prs);}
  else {toast("Session saved 💪");}
  renderGraphs();
}
function prCelebrate(prs){
  const t=$("#toast");t.className="show pr";
  t.textContent=`★ NEW PR! ${prs.map(p=>p.name).slice(0,2).join(", ")}${prs.length>2?` +${prs.length-2}`:''}`;
  confetti();
  setTimeout(()=>{t.className="";},2600);
}
function toast(msg){const t=$("#toast");t.className="show";t.textContent=msg;
  clearTimeout(t._t);t._t=setTimeout(()=>{t.className="";},2200);}

/* lightweight confetti (no lib) */
function confetti(){
  const cols=["#ff3a22","#628078","#c7af6b","#a4893d","#ff6a55"];
  const c=document.createElement("div");
  c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden";
  document.body.appendChild(c);
  for(let i=0;i<70;i++){const p=document.createElement("div");
    const size=6+Math.random()*7;
    p.style.cssText=`position:absolute;top:-14px;left:${Math.random()*100}%;width:${size}px;height:${size*0.5}px;
      background:${cols[i%cols.length]};opacity:.95;border-radius:2px;
      transform:rotate(${Math.random()*360}deg)`;
    const dur=1100+Math.random()*1200, x=(Math.random()-.5)*160;
    p.animate([{transform:`translate(0,0) rotate(0)`,opacity:1},
      {transform:`translate(${x}px,${window.innerHeight+40}px) rotate(${540+Math.random()*540}deg)`,opacity:.9}],
      {duration:dur,easing:"cubic-bezier(.2,.6,.4,1)"});
    c.appendChild(p);}
  setTimeout(()=>c.remove(),2600);
}

/* ---------- GRAPHS ---------- */
const METRICS=[
  {k:"weight",label:"Weight",unit:()=>unitLbl(),color:"#628078",conv:v=>round1(fromKg(v))},
  {k:"kcal",label:"Calories",unit:()=>"cal",color:"#ff3a22",food:true},
  {k:"steps",label:"Steps",unit:()=>"",color:"#a4893d"},
  {k:"deep",label:"Deep sleep",unit:()=>"h",color:"#c7af6b"},
  {k:"sleep",label:"Total sleep",unit:()=>"h",color:"#628078"},
  {k:"waist",label:"Waist",unit:()=>"cm",color:"#ff3a22"},
  {k:"hip",label:"Hip",unit:()=>"cm",color:"#ff6a55"},
  {k:"chest",label:"Chest",unit:()=>"cm",color:"#a4893d"},
  {k:"cardioDist",label:"Cardio km",unit:()=>"km",color:"#628078"},
  {k:"cardioPace",label:"Cardio pace",unit:()=>"/km",color:"#a4893d"},
  {k:"bps",label:"BP systolic",unit:()=>"mmHg",color:"#ff3a22"},
  {k:"jab",label:"Jab",unit:()=>"mg",color:"#a4893d"},
  {k:"hrv",label:"HRV",unit:()=>"ms",color:"#628078"},
  {k:"fast",label:"Fasting h",unit:()=>"h",color:"#c7af6b"}
];
function metricPoints(k){
  if(k==="kcal")return kcalDaily();
  if(k==="cardioDist")return cardioDaily("dist");
  if(k==="cardioPace")return cardioDaily("pace");
  if(k==="fast")return fastingSeries();
  const m=METRICS.find(x=>x.k===k);const s=mergedDaily(k);
  return (m&&m.conv)? s.map(p=>({date:p.date,val:m.conv(p.val)})) : s;
}
function cardioDaily(mode){
  const dd={},du={};
  state.workouts.forEach(w=>{const key=dkey(w.date);(w.exercises||[]).forEach(ex=>{
    if(ex.type==="cardio"&&ex.cardio){
      if(ex.cardio.distanceKm!=null)dd[key]=(dd[key]||0)+ex.cardio.distanceKm;
      if(ex.cardio.durationMin!=null)du[key]=(du[key]||0)+ex.cardio.durationMin;}});});
  if(mode==="dist")return Object.keys(dd).sort().map(k=>({date:k,val:round1(dd[k])}));
  return Object.keys(dd).filter(k=>dd[k]>0&&du[k]!=null).sort().map(k=>({date:k,val:round1(du[k]/dd[k])}));
}
function fastingSeries(){return (state.fasting.history||[]).map(f=>({date:dkey(f.end),val:round1((f.end-f.start)/3600000)})).sort((a,b)=>a.date<b.date?-1:1);}
const RANGES=[["week","1W"],["month","1M"],["q","3M"],["year","1Y"],["custom","Custom"]];
function rangeBounds(){
  const today=dkey(Date.now());
  if(graphRange==="custom")return {from:graphCustom.from,to:graphCustom.to||today};
  const days={week:7,month:30,q:90,year:365}[graphRange]||7;
  return {from:dkey(startOfDay(Date.now())-((days-1)*864e5)),to:today};
}
function filterRange(pts){const b=rangeBounds();
  return pts.filter(p=>(!b.from||p.date>=b.from)&&(!b.to||p.date<=b.to));}
function rangeLabel(){

function trendSummary(){
  return METRICS.map(m=>{const pts=filterRange(metricPoints(m.k));if(!pts.length)return "";
    const last=pts[pts.length-1].val, first=pts[0].val, d=round1(last-first);
    const lowerBetter=(m.k==="weight"||m.k==="waist"||m.k==="hip"||m.k==="kcal"||m.k==="cardioPace"||m.k==="bps");
    const cls=d===0?'flat':((d<0)===lowerBetter?'up':'down');
    const arrow=d>0?`▲ ${fmtNum(Math.abs(d))}`:d<0?`▼ ${fmtNum(Math.abs(d))}`:'—';
    return `<div class="prog-item"><div class="nm">${m.label}</div><div class="bw tnum">${fmtNum(last)}<small> ${m.unit()}</small></div><div class="chg ${cls}">${arrow}</div></div>`;
  }).join("");
}
function drawTrend(){

  else{const m=METRICS.find(x=>x.k===graphMetric)||METRICS[0];pts=metricPoints(m.k);label=m.label;unit=m.unit();color=m.color;}
  pts=filterRange(pts);
  const labels=pts.map(p=>p.date), data=pts.map(p=>p.val);
  if(chart)chart.destroy();
  const ctx=cv.getContext("2d");
  const grad=ctx.createLinearGradient(0,0,0,230);
  grad.addColorStop(0,color+"55");grad.addColorStop(1,color+"00");
  const many=data.length>90;
  chart=new Chart(ctx,{type:"line",data:{labels,datasets:[{data,label,borderColor:color,borderWidth:2.5,
    tension:.25,fill:true,backgroundColor:grad,pointRadius:many?0:3,pointHoverRadius:5,
    pointBackgroundColor:color,pointBorderColor:"#ffffff",pointBorderWidth:1.5}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{legend:{display:false},tooltip:{backgroundColor:"#191714",borderColor:"#3a3630",borderWidth:1,
        titleColor:"#ffffff",bodyColor:"#e4dfd2",padding:10,callbacks:{label:c=>` ${fmtNum(c.parsed.y)} ${unit}`}}},
      scales:{x:{grid:{color:"rgba(60,40,10,.10)"},ticks:{color:"#9b937f",font:{family:"Archivo",weight:"700",size:10},
        maxRotation:0,autoSkip:true,maxTicksLimit:7,callback:function(v){const l=this.getLabelForValue(v);return l?String(l).slice(5):l;}}},
        y:{grid:{color:"rgba(60,40,10,.10)"},ticks:{color:"#6c6454",font:{family:"Archivo",weight:"700",size:10},
          precision:1,callback:v=>fmtNum(v)+(unit||"")},grace:"6%"}}}});
}

/* ---- file saving: works inside the sandboxed artifact (downloads capability)
   and as a plain hosted/opened file (anchor fallback) ---- */
let _dlCap;
async function getDownloads(){
  if(_dlCap!==undefined)return _dlCap;
  try{_dlCap=(window.claude&&claude.use)?await claude.use("downloads"):null;}
  catch(e){_dlCap=null;}
  return _dlCap;
}
function anchorSave(blob,name){
  try{const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},800);return true;}catch(e){return false;}
}
async function saveFile(name,blob){
  const dl=await getDownloads();
  if(dl){try{await dl.save({filename:name,data:blob});toast("Saved ✓");return;}
    catch(e){if(e&&e.code==="declined")return;}}
  if(!anchorSave(blob,name))toast("Couldn't save file");
}

$("#healthFile").addEventListener("change",function(){
  const files=Array.from(this.files||[]);this.value="";
  if(!files.length)return;
  let done=0, touchedDays=new Set(), bad=0;
  const finish=()=>{
    if(done<files.length)return;
    if(touchedDays.size){state.settings.lastSync=Date.now();save();renderActive();
      toast(`✓ Synced ${touchedDays.size} day${touchedDays.size>1?'s':''} from ${files.length} file${files.length>1?'s':''}`);}
    else toast(bad?"Those look like Excel/Sheets files — export as CSV":"No readable rows — need a CSV with a date column");
  };
  files.forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{try{
      const txt=(r.result||"");
      let binary=false;for(let bi=0;bi<Math.min(16,txt.length);bi++){const cc=txt.charCodeAt(bi);if(cc===0||cc===65533){binary=true;break;}}
      if(txt.slice(0,2)==="PK"||binary){bad++;}
      else{const days=importHealthDays(txt,f.name);days.forEach(d=>touchedDays.add(d));}
    }catch(e){}finally{done++;finish();}};
    r.onerror=()=>{done++;finish();};
    r.readAsText(f);
  });
});
$("#importFile").addEventListener("change",function(){
  const f=this.files&&this.files[0];if(!f)return;

const MEALS=["Breakfast","Lunch","Dinner","Snacks"];
function dkey(date){const d=new Date(date);const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
function fmtFullDate(d){return new Date(d).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});}
function fmtDDMMYYYY(d){d=new Date(d);const p=n=>String(n).padStart(2,"0");return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;}
function histFor(date){return CAL_HISTORY[dkey(date)]||null;}
function foodDay(date){return (state.food&&state.food[dkey(date)])||null;}
function mealTotal(date,m){const fd=foodDay(date);if(!fd||!fd[m])return null;return Math.round(fd[m].reduce((a,it)=>a+(+it.k||0),0));}
function foodTotals(date){
  const fd=foodDay(date);
  if(fd){let k=0,p=0,c=0,f=0;MEALS.forEach(m=>(fd[m]||[]).forEach(it=>{k+=+it.k||0;p+=+it.p||0;c+=+it.c||0;f+=+it.f||0;}));
    return {kcal:Math.round(k),p:Math.round(p),c:Math.round(c),f:Math.round(f),source:"live"};}
  // only past days fall back to imported totals; today/future start fresh at 0
  if(dkey(date) < dkey(Date.now())){const h=histFor(date);
    if(h&&h.kcal!=null)return {kcal:h.kcal||0,p:h.p||0,c:h.c||0,f:h.f||0,source:"history"};}
  return {kcal:0,p:0,c:0,f:0,source:"empty"};
}
function macroGoals(){return state.settings.macros||null;}
function macroChips(ft){const g=macroGoals();
  const cell=(lbl,val,tgt,cls)=>`<span class="mc ${cls}">${lbl} ${val}${tgt?('/'+tgt):''}g</span>`;
  return `<div class="macros">${cell('C',ft.c,g&&g.c,'c')}${cell('P',ft.p,g&&g.p,'p')}${cell('F',ft.f,g&&g.f,'f')}</div>`;
}
function bodyVal(date,field){const k=dkey(date);
  if(state.body&&state.body[k]&&state.body[k][field]!=null)return state.body[k][field];
  const h=CAL_HISTORY[k];if(h&&h[field]!=null)return h[field];return null;}
function mergedDaily(field){
  const m={};
  for(const d in CAL_HISTORY){const v=CAL_HISTORY[d][field];if(v!=null)m[d]=v;}
  if(state.body)for(const d in state.body){const v=state.body[d][field];if(v!=null)m[d]=v;}
  return Object.keys(m).sort().map(d=>({date:d,val:m[d]}));
}
function kcalDaily(){
  const m={};
  for(const d in CAL_HISTORY){const v=CAL_HISTORY[d].kcal;if(v!=null)m[d]=v;}
  if(state.food)for(const d in state.food){const t=foodTotals(new Date(d+"T12:00"));if(t.source==="live")m[d]=t.kcal;}
  return Object.keys(m).sort().map(d=>({date:d,val:m[d]}));
}
function latestVal(field){const s=mergedDaily(field);if(!s.length)return {val:null,date:null};
  const today=dkey(Date.now());let r={val:null,date:null};
  for(const p of s){if(p.date<=today)r={val:p.val,date:p.date};}return r;}
function addFood(date,meal,item){const k=dkey(date);state.food[k]=state.food[k]||{};state.food[k][meal]=state.food[k][meal]||[];state.food[k][meal].push(item);save();}
function removeFood(date,meal,idx){const k=dkey(date);if(state.food[k]&&state.food[k][meal]){state.food[k][meal].splice(idx,1);
  if(!state.food[k][meal].length)delete state.food[k][meal];
  if(!Object.keys(state.food[k]).length)delete state.food[k];save();}}

/* ========================= Health Connect import (manual/forced sync) ========================= */
function importHealth(){const el=document.getElementById("healthFile");if(el)el.click();}

/* ---- Google Drive auto-read via the viewer's connector (mcp capability) ---- */
const DRIVE_SERVER="Google Drive";
function isNativeApp(){return !!(window.AndroidAscend&&window.AndroidAscend.requestSync);}
function syncHealth(){
  if(isNativeApp()){toast("Reading from your ring…");try{window.AndroidAscend.requestSync();}catch(e){toast("Native sync error");}return;}
  driveSync();
}
async function getMcp(){try{return (window.claude&&claude.use)?await claude.use("mcp"):null;}catch(e){return null;}}
function b64ToText(s){try{return decodeURIComponent(escape(atob(s)));}catch(e){try{return atob(s);}catch(e2){return s;}}}
function looksBase64(s){return typeof s==="string"&&s.length>16&&/^[A-Za-z0-9+/=\s]+$/.test(s)&&s.indexOf("\n")<0&&s.indexOf(",")<0;}
function maybeDecode(s){ // raw CSV passes through; base64 gets decoded
  if(typeof s!=="string")return "";
  if(/[\n,;]/.test(s))return s; // already delimited text
  if(looksBase64(s)){const t=b64ToText(s);if(/[\n,;]/.test(t))return t;}
  return s;
}
function extractContent(payload){
  if(payload==null)return "";
  if(typeof payload==="string")return maybeDecode(payload);
  const c=payload.content??payload.data??payload.base64Content??payload.text??payload.body??payload.fileContent;
  return maybeDecode(c);
}
async function driveSync(){
  toast("Checking Google Drive…");
  const mcp=await getMcp();
  if(!mcp){toast("Open Ascend inside the Claude app (signed in) to use Drive sync");return;}
  try{
    const since=new Date(Date.now()-1000*3600*24*14).toISOString();
    const q=`mimeType='text/csv' and modifiedTime > '${since}' and (title contains 'Activity' or title contains 'Vitals' or title contains 'Sleep')`;
    const res=await mcp.callTool(DRIVE_SERVER,"search_files",{query:q,pageSize:30,excludeContentSnippets:true});
    const files=((res&&res.payload&&res.payload.files)||[]);
    if(!files.length){toast("No Activity/Vitals/Sleep CSVs found in Drive (last 14 days)");return;}
    // newest file per category
    const pick={};
    files.forEach(f=>{const t=(f.title||"").toLowerCase();["activity","vitals","sleep"].forEach(cat=>{
      if(t.includes(cat)){const prev=pick[cat];if(!prev||new Date(f.modifiedTime)>new Date(prev.modifiedTime))pick[cat]=f;}});});
    const chosen=Object.values(pick);
    if(!chosen.length){toast("Found CSVs but none named Activity/Vitals/Sleep");return;}
    let days=new Set();
    for(const f of chosen){
      const dl=await mcp.callTool(DRIVE_SERVER,"download_file_content",{fileId:f.id});
      const text=extractContent(dl&&dl.payload);
      importHealthDays(text,f.title).forEach(d=>days.add(d));
    }
    if(days.size){state.settings.lastSync=Date.now();save();renderActive();toast(`✓ Drive sync: ${days.size} day${days.size>1?'s':''} from ${chosen.length} file${chosen.length>1?'s':''}`);}
    else toast("Files read but no new rows — check the column names");
  }catch(e){
    const code=e&&e.code;
    if(code==="needs_reauth")toast("Reconnect Google Drive in claude.ai → Settings → Connectors");
    else if(code==="server_not_connected"||code==="not_granted")toast("Add Google Drive in claude.ai → Settings → Connectors");
    else if(code==="server_unavailable"||code==="upstream_error")toast("Drive busy — try again in a moment");
    else toast("Drive sync failed"+(e&&e.message?": "+e.message:""));
  }
}
function lastSyncText(){const t=state.settings.lastSync;
  if(!t)return "Not synced yet. Export your Health Connect data (CSV/JSON) with an app like Health Sync, then tap to import.";
  const mins=Math.round((Date.now()-t)/60000);
  const ago=mins<1?"just now":mins<60?mins+" min ago":Math.round(mins/60)+"h ago";
  return "Last synced "+ago+" · "+new Date(t).toLocaleString(undefined,{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});}
function minToH(v){return v>24?round1(v/60):round1(v);}
function normDate(s){s=(""+(s||"")).trim();if(!s)return null;
  let d=new Date(s);
  if(isNaN(d.getTime())){const m=s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if(m){let yr=+m[3];if(yr<100)yr+=2000;d=new Date(yr,(+m[2])-1,+m[1]);}}
  if(isNaN(d.getTime()))return null;const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
const HEALTH_FIELDS=["steps","deep","sleep","hrv","weight","waist","hip","chest","bps","bpd"];
function normalizeRow(o){const row={date:normDate(o.date||o.day||o.Date||o.Day)};
  const map={steps:/step/i,deep:/deep/i,sleep:/^sleep$|total.*sleep|sleep.*total|^asleep/i,hrv:/hrv|variab/i,weight:/weight|mass/i,waist:/waist/i,hip:/hip/i,chest:/chest/i,bps:/systolic|bps/i,bpd:/diastolic|bpd/i};
  for(const key in o){const lk=key.toLowerCase();for(const f in map){if(map[f].test(lk)){let v=parseFloat(o[key]);
    if(isFinite(v)){if(f==="deep"||f==="sleep")v=minToH(v);else if(f==="hrv"||f==="weight")v=round1(v);else v=Math.round(v);row[f]=v;}}}}
  return row;}
function importHealthData(text,name){
  let rows=[];const t=(text||"").trim();if(!t)return 0;
  if((name||"").toLowerCase().endsWith(".json")||t[0]==="["||t[0]==="{"){
    let j=JSON.parse(t);if(!Array.isArray(j))j=j.days||j.data||j.records||[];rows=j.map(normalizeRow);
  }else{
    const lines=t.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return 0;
    const sep=lines[0].indexOf(";")>-1&&lines[0].indexOf(",")<0?";":",";
    const head=lines[0].split(sep).map(h=>h.trim().toLowerCase());
    const find=re=>head.findIndex(h=>re.test(h));
    const di=find(/date|day|time/),si=find(/step/),dpi=head.findIndex(h=>/deep/.test(h)),
      sli=head.findIndex(h=>/sleep/.test(h)&&!/deep/.test(h)),hi=find(/hrv|variab/),
      wi=find(/weight|mass/),wa=find(/waist/),hp=find(/hip/),ch=find(/chest/),sy=find(/systolic/),dia=find(/diastolic/);
    for(let i=1;i<lines.length;i++){const c=lines[i].split(sep);const g=k=>k>=0?parseFloat(c[k]):NaN;
      const d=normDate(di>=0?c[di]:"");if(!d)continue;const row={date:d};
      if(isFinite(g(si)))row.steps=Math.round(g(si));
      if(isFinite(g(dpi)))row.deep=minToH(g(dpi));
      if(isFinite(g(sli)))row.sleep=minToH(g(sli));
      if(isFinite(g(hi)))row.hrv=round1(g(hi));
      if(isFinite(g(wi)))row.weight=round1(g(wi));
      if(isFinite(g(wa)))row.waist=round1(g(wa));
      if(isFinite(g(hp)))row.hip=round1(g(hp));
      if(isFinite(g(ch)))row.chest=round1(g(ch));
      if(isFinite(g(sy)))row.bps=Math.round(g(sy));
      if(isFinite(g(dia)))row.bpd=Math.round(g(dia));
      rows.push(row);}
  }
  const touched=[];
  rows.forEach(r=>{if(!r||!r.date)return;const k=r.date;const cur=state.body[k]||{};let hit=false;
    HEALTH_FIELDS.forEach(f=>{if(r[f]!=null&&isFinite(r[f])){cur[f]=r[f];hit=true;}});
    if(hit){state.body[k]=cur;touched.push(k);}});
  if(touched.length){save();}
  return touched;
}
// back-compat single-file helpers
function importHealthDays(text,name){return importHealthData(text,name);}

/* ========================= Fasting + extras ========================= */
const FAST_PROTOCOLS={"16:8":16,"18:6":18,"20:4":20,"OMAD":23,"14:10":14};
function fastTarget(){return FAST_PROTOCOLS[state.fasting.protocol]||16;}
function fastElapsedH(){return state.fasting.start?(Date.now()-state.fasting.start)/3600000:0;}
function lastFastEnd(){const h=state.fasting.history;return h.length?h[h.length-1].end:null;}
function hoursSince(ts){return ts?(Date.now()-ts)/3600000:null;}
function fmtHM(h){const t=Math.max(0,Math.round(h*60));return `${Math.floor(t/60)}h ${String(t%60).padStart(2,"0")}m`;}
function startFast(){state.fasting.start=Date.now();save();renderHome();}
function endFast(){if(state.fasting.start){state.fasting.history.push({start:state.fasting.start,end:Date.now()});state.fasting.start=null;save();}renderHome();}
let fastInt=null;
function startFastTick(){stopFastTick();if(!state.fasting.start)return;
  fastInt=setInterval(()=>{const e=document.getElementById("fastTime");if(!e){stopFastTick();return;}
    const h=fastElapsedH();e.textContent=fmtHM(h);const r=document.getElementById("fastRing");
    if(r)r.style.setProperty("--p",Math.min(100,Math.round(h/fastTarget()*100)));},1000);}
function stopFastTick(){if(fastInt){clearInterval(fastInt);fastInt=null;}}
function fmtClock(ts){return new Date(ts).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}
function fmtClockDay(ts){const d=new Date(ts);const today=sameDay(d,Date.now());
  const tm=d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  return today?tm:d.toLocaleDateString(undefined,{weekday:"short"})+" "+tm;}
function fastCard(){
  const active=!!state.fasting.start;const target=fastTarget();
  let h,label,pct,btn,times="";
  if(active){h=fastElapsedH();label="Fasting";pct=Math.min(100,Math.round(h/target*100));
    btn=`<button class="btn btn-block fast-end" id="fastBtn">Stop fasting</button>`;
    const startTs=state.fasting.start, endTs=startTs+target*3600000;
    const reached=Date.now()>=endTs;
    times=`<div class="fast-times">
      <div class="ft-col"><span>Started</span><b>${fmtClockDay(startTs)}</b></div>
      <div class="ft-arrow">→</div>
      <div class="ft-col"><span>${reached?'Goal hit':'Ends'}</span><b class="${reached?'done':''}">${fmtClockDay(endTs)}</b></div>
    </div>`;}
  else{const since=hoursSince(lastFastEnd());h=since||0;label="Since last fast";pct=0;
    btn=`<button class="btn btn-primary btn-block" id="fastBtn">Start fasting</button>`;
    const lastEnd=lastFastEnd();
    if(lastEnd)times=`<div class="fast-times idle"><div class="ft-col"><span>Last fast ended</span><b>${fmtClockDay(lastEnd)}</b></div></div>`;}
  return `<div class="fast-card">
    <div class="fast-top">
      <button class="fast-proto" id="fastProto">${state.fasting.protocol} ▾</button>
      <div class="fast-ring ${active?'on':''}" id="fastRing" style="--p:${pct}"><div class="fast-inner"><div class="fast-lbl">${label}</div><div class="fast-time" id="fastTime">${fmtHM(h)}</div></div></div>
      <div class="fast-target">${active?`target<br>${target}h`:`goal<br>${target}:${24-target}`}</div>
    </div>${times}${btn}</div>`;
}
function openFastProto(){
  const sheet=document.createElement("div");sheet.className="scrim";
  sheet.innerHTML=`<div class="sheet"><div class="grab"></div><h2>Fasting protocol</h2>
    <div class="proto-grid">${Object.keys(FAST_PROTOCOLS).map(p=>`<button class="proto-opt ${p===state.fasting.protocol?'on':''}" data-p="${p}">${p}<small>${FAST_PROTOCOLS[p]}h fast</small></button>`).join("")}</div>
    <button class="btn btn-ghost btn-block" id="protoClose" style="margin-top:14px;color:var(--faint)">Done</button></div>`;
  document.body.appendChild(sheet);const close=()=>sheet.remove();
  sheet.addEventListener('click',e=>{if(e.target===sheet)close();});
  $("#protoClose",sheet).addEventListener('click',close);
  $$('.proto-opt',sheet).forEach(b=>b.addEventListener('click',()=>{state.fasting.protocol=b.dataset.p;save();close();renderHome();}));
}
function bpText(){const s=latestVal("bps"),d=latestVal("bpd");if(s.val==null)return "–";return `${s.val}/${d.val!=null?d.val:'–'}`;}
function jabText(){const j=latestVal("jab");if(j.val==null)return "–";return `${round1(j.val)}<small>mg</small>`;}

/* ---- native bridge: the Android wrapper calls this to inject Health Connect data ---- */
window.__ascendHealthImport=function(rows){
  try{
    const arr=(typeof rows==="string")?JSON.parse(rows):rows;
    if(!Array.isArray(arr)||!arr.length)return 0;
    const n=importHealthDays(JSON.stringify(arr),"native.json");
    const days=Array.isArray(n)?n.length:n;

      if(typeof toast==="function")toast(`✓ Synced ${days} day${days>1?'s':''} from your ring`);}

  }catch(e){return 0;}
};
window.__ascendIsReady=function(){return true;};

// boot — restore any in-progress workout saved before the app closed
try{const d=loadDraft();if(d&&Array.isArray(d.exercises)){session=d;session.startedAt=Date.now();
  session.timer=session.timer||{running:false,elapsedBefore:0,startedAt:null};
  if(session.timer.running){session.timer.running=false;session.timer.startedAt=null;} // pause on restore, don't count closed time
  startAutoSave();}}catch(e){}
renderHome();
if(session){setTimeout(()=>toast("Restored your in-progress workout — open Log"),500);}
