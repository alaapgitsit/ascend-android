name: Build Ascend APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.log
          if-no-files-found: warn

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ascend-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Report failure as issue
        if: steps.build.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo '```' > err.txt
          grep -iE "e: |error:|FAILURE|What went wrong|Could not|Unresolved|Caused by|> Task|BUILD FAILED|Execution failed" build-output.log | tail -120 >> err.txt || true
          echo '--- last 120 lines ---' >> err.txt
          tail -120 build-output.log >> err.txt || echo "no build log" >> err.txt
          echo '```' >> err.txt
          head -c 60000 err.txt > errb.txt
          gh issue create --title "buildlog ${{ github.run_id }}" --body-file errb.txt
          exit 1
